name: Build Crypto Sentinel APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Setup Permanent Signing Keystore
        run: |
          mkdir -p keystore
          if [ ! -f keystore/sentinel.keystore ]; then
            keytool -genkeypair -v \
              -keystore keystore/sentinel.keystore \
              -alias sentinel \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass cryptosentinel \
              -keypass cryptosentinel \
              -dname "CN=CryptoSentinel,OU=Trading,O=Sentinel,C=US"
          fi

      - name: Build APK with Gradle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/CryptoSentinel.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoSentinel-APK
          path: output/CryptoSentinel.apk

      - name: Create Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.4' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Crypto Sentinel Android {0}', github.ref_name) || 'Crypto Sentinel Android v1.1.4' }}
          body: |
            ## ⚡ Crypto Sentinel Android v1.1.4 (Early Breakout Ignition Engine & Clean Signals)
            
            ### 🚀 What's New in v1.1.4:
            - ⚡ **Early Breakout Ignition Engine**: Detects newly awakening moves by measuring 1-hour price velocity against a calm 24h baseline (-8% to +15%). Completely eliminates chasing exhausted +50% pumps!
            - 🎯 **Ignition-Focused Depth Radar**: The Whale Depth Wall Radar automatically prioritizes the freshest early movers, scanning their Level 2 order books for whale support walls ($\ge 60\%$ Bids).
            - 🔕 **Clean Engine Signals (No Whale Spam)**: Removed raw whale order notification spam. The feed and phone alerts now exclusively deliver high-conviction **Early Ignition Signals** (`🔥 EARLY LONG / SHORT`), **Radar Signals**, and **Auto-Trades**.
            - 📊 **1h Velocity Badges**: Early mover cards now prominently show `+X.X% 1h` ignition momentum and 24h baseline.

            ### 🛠️ Stable Signing:
            - 🔑 **Dual Signature Schemes (v1 JAR + v2 APK Block)**: Permanent dual-signed release with `sentinel.keystore`. Installs seamlessly over previous versions with 1 tap.

            ### 📥 Download
            Download `CryptoSentinel.apk` below and tap to update on your phone.
          files: output/CryptoSentinel.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
