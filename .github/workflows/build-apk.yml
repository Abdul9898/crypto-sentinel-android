name: Build Crypto Sentinel APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Setup Permanent Signing Keystore
        run: |
          mkdir -p keystore
          if [ ! -f keystore/sentinel.keystore ]; then
            keytool -genkeypair -v \
              -keystore keystore/sentinel.keystore \
              -alias sentinel \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass cryptosentinel \
              -keypass cryptosentinel \
              -dname "CN=CryptoSentinel,OU=Trading,O=Sentinel,C=US"
          fi

      - name: Build APK with Gradle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/CryptoSentinel.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoSentinel-APK
          path: output/CryptoSentinel.apk

      - name: Create Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.1' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Crypto Sentinel Android {0}', github.ref_name) || 'Crypto Sentinel Android v1.2.1' }}
          body: |
            ## ⚡ Crypto Sentinel Android v1.2.1 (Universal Volume Engine & 4-TF Volume Spike Detection)
            
            ### 🚀 What's New in v1.2.1:
            - 💧 **Universal 24h Ticker Volume (All Symbols & BTC)**: Cached live Bybit 24h ticker metrics for every linear symbol. BTC and any selected coin now accurately show their real 24h turnover (e.g. `$28.5B`), 1h velocity, and 24h high/low range instead of `$0`.
            - 🔥 **4-Timeframe Volume Spike Surge Detector (1m, 5m, 15m, 1h)**: Continuously scans volume surges across 4 timeframes (1m ignition, 5m acceleration, 15m breakout, 1h macro). Displays active surges (e.g. `🔥 VOL SURGE: 1m:3.2x | 5m:2.4x`) to confirm momentum pushes price into profit.
            - 🛡️ **Anti-Panic Cut (45-Second Breathing Room & Confirmed Cross)**:
              - Added a 45-second grace period for new trades so normal opening bid-ask spreads do not cause premature 0-second panic exits.
              - Reversal Cut only triggers if position loss is real (`curPnl <= -$2.00`) AND a confirmed opposing cross occurs.
              - Hard Max Loss Cap (`-$3.50`) continues to strictly prevent losses from exceeding the user's risk tolerance.
            - 🚫 **Sub-Cent Micro-Token Filter (< $0.05)**: Filtered out tokens priced under $0.05 (such as HUMA and QUSDT) where wide tick spreads could cause unexpected pip slippage.
            
            ### 🛠️ Stable Signing:
            - 🔑 **Dual Signature Schemes (v1 + v2)**: Permanent signed release with `sentinel.keystore`. Installs seamlessly over previous versions.
            
            ### 📥 Download
            Download `CryptoSentinel.apk` below and install directly on your phone:
            `https://github.com/Abdul9898/crypto-sentinel-android/releases/download/v1.2.1/CryptoSentinel.apk`
          files: output/CryptoSentinel.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
