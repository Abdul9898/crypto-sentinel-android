name: Build Crypto Sentinel APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Setup Permanent Signing Keystore
        run: |
          mkdir -p keystore
          if [ ! -f keystore/sentinel.keystore ]; then
            keytool -genkeypair -v \
              -keystore keystore/sentinel.keystore \
              -alias sentinel \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass cryptosentinel \
              -keypass cryptosentinel \
              -dname "CN=CryptoSentinel,OU=Trading,O=Sentinel,C=US"
          fi

      - name: Build APK with Gradle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/CryptoSentinel.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoSentinel-APK
          path: output/CryptoSentinel.apk

      - name: Create Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.8' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Crypto Sentinel Android {0}', github.ref_name) || 'Crypto Sentinel Android v1.1.8' }}
          body: |
            ## ⚡ Crypto Sentinel Android v1.1.8 (⚡ Quick $2.00 Take Profit Engine)
            
            ### 🚀 What's New in v1.1.8:
            - ⚡ **Quick $2.00 Take Profit Engine**: Any coin entering a trade will now lock in profit and exit as soon as it reaches $2.00 net USD profit (`pnlUsd >= $2.00`). Accumulate gains fast with high turnover without waiting for deep price swings!
            - 🛡️ **Preserved Stop Loss Floor**: Stop loss thresholds (`slPct`), auto break-even (`isBreakEvenEnabled`), and trailing stop protection are completely preserved without alteration for robust downside protection.
            - ⚙️ **Configurable Target Profit**: Added a dedicated `⚡ Quick Take Profit (Target USD Profit)` setting in Trading Settings (defaults to $2.0 USD).
            - 📊 **Synchronized 3-TF Chart**: Chart preview lines for TP automatically calculate and display the exact target price corresponding to your $2 take-profit level across all timeframes (5m, 15m, 1h).
            - 🏆 **Clear Victory Outcome**: Closed winning trades now log clearly as `🏆 [WIN (+$2 TP)]` in your alerts and trade stories.
            
            ### 🛠️ Stable Signing:
            - 🔑 **Dual Signature Schemes (v1 + v2)**: Permanent signed release with `sentinel.keystore`. Installs seamlessly over previous versions without signature conflicts.
            
            ### 📥 Download
            Download `CryptoSentinel.apk` below and install directly on your phone.
          files: output/CryptoSentinel.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
