name: Build Crypto Sentinel APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Setup Permanent Signing Keystore
        run: |
          mkdir -p keystore
          if [ ! -f keystore/sentinel.keystore ]; then
            keytool -genkeypair -v \
              -keystore keystore/sentinel.keystore \
              -alias sentinel \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass cryptosentinel \
              -keypass cryptosentinel \
              -dname "CN=CryptoSentinel,OU=Trading,O=Sentinel,C=US"
          fi

      - name: Build APK with Gradle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/CryptoSentinel.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoSentinel-APK
          path: output/CryptoSentinel.apk

      - name: Create Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.5' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Crypto Sentinel Android {0}', github.ref_name) || 'Crypto Sentinel Android v1.1.5' }}
          body: |
            ## ⚡ Crypto Sentinel Android v1.1.5 (Strict CVD Direction & 12h Calculations)
            
            ### 🚀 What's New in v1.1.5:
            - 🛡️ **Strict CVD Direction Filter**: Never enter into falling knives! Before ANY auto-trade or radar trade is opened:
              - **LONG**: Requires aggressive buyers with positive CVD (`CVD > 0`) and rising price velocity (`1h >= -0.5%`). Long is FORBIDDEN if CVD is negative/dumping.
              - **SHORT**: Requires aggressive sellers with negative CVD (`CVD < 0`) and falling price velocity (`1h <= 0.5%`). Short is FORBIDDEN if CVD is positive/rising.
            - ⏱️ **12-Hour Momentum Calculations**: Switched from 24h baseline to 12h calculations for sharper, more reactive trend detection without waiting for old 24h lag.
            - 📈 **CVD High/Low Upper & Lower Envelope Bands**: On the interactive Candlestick & CVD chart:
              - Dashed green **CVD HIGH** upper envelope line.
              - Dashed red **CVD LOW** lower envelope line.
              - Dynamic `▲ CVD RISING` / `▼ CVD DROPPING` slope badge showing real-time CVD direction.
            - 🎯 **Directional Early Ignition Signals**: Gainers are segregated into clean Long and Short ignition candidates with CVD confirmation before alerting.

            ### 🛠️ Stable Signing:
            - 🔑 **Dual Signature Schemes (v1 JAR + v2 APK Block)**: Permanent dual-signed release with `sentinel.keystore`. Installs seamlessly over previous versions with 1 tap.

            ### 📥 Download
            Download `CryptoSentinel.apk` below and tap to update on your phone.
          files: output/CryptoSentinel.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
