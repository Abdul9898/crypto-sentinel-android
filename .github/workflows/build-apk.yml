name: Build Crypto Sentinel APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Setup Permanent Signing Keystore
        run: |
          mkdir -p keystore
          if [ ! -f keystore/sentinel.keystore ]; then
            keytool -genkeypair -v \
              -keystore keystore/sentinel.keystore \
              -alias sentinel \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass cryptosentinel \
              -keypass cryptosentinel \
              -dname "CN=CryptoSentinel,OU=Trading,O=Sentinel,C=US"
          fi

      - name: Build APK with Gradle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/CryptoSentinel.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoSentinel-APK
          path: output/CryptoSentinel.apk

      - name: Create Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.2' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Crypto Sentinel Android {0}', github.ref_name) || 'Crypto Sentinel Android v1.2.2' }}
          body: |
            ## ⚡ Crypto Sentinel Android v1.2.2 (Pure 4-Timeframe Volume Surge Trading)
            
            ### 🚀 What's New in v1.2.2:
            - 🌊 **Pure Volume Surge Entry (Any Timeframe: 1m, 5m, 15m, 1h)**: The bot now triggers trades directly on volume spikes across all 4 timeframes! When a surge occurs, the bot enters immediately following the candle direction (Green = LONG, Red = SHORT) to capture rapid momentum pushes.
            - 🎯 **Pure Quick TP ($2.00) & Hard SL ($3.50)**: All indicator-based reversal cuts have been eliminated. Positions have full breathing room to run directly to our quick +$2.00 profit target or exit at the strict -$3.50 hard stop-loss cap (with +1.5% auto break-even lock).
            - ⚡ **Enhanced Multi-Candle Volume Surge Engine**: Detects both developing live surges ($\ge 1.8\times$) and completed candle spikes ($\ge 2.0\times$) against 10-candle moving average volume.
            - 📊 **4-Timeframe Live Volume Heat-Map Badges (1M, 5M, 15M, 1H)**: Added real-time badges displaying live volume multiplier and candle bias across all 4 timeframes on the focal cockpit card. Active spikes light up in vibrant cyan (`🔥 1M: 3.2x`).
            - 🛡️ **Sub-Cent Micro-Token Filter (< $0.05)** & **24/7 Background Persistence** maintained.
            
            ### 🛠️ Stable Signing:
            - 🔑 **Dual Signature Schemes (v1 + v2)**: Permanent signed release with `sentinel.keystore`. Installs seamlessly over previous versions.
            
            ### 📥 Download
            Download `CryptoSentinel.apk` below and install directly on your phone:
            `https://github.com/Abdul9898/crypto-sentinel-android/releases/download/v1.2.2/CryptoSentinel.apk`
          files: output/CryptoSentinel.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
