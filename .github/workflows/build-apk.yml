name: Build Crypto Sentinel APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Setup Permanent Signing Keystore
        run: |
          mkdir -p keystore
          if [ ! -f keystore/sentinel.keystore ]; then
            keytool -genkeypair -v \
              -keystore keystore/sentinel.keystore \
              -alias sentinel \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass cryptosentinel \
              -keypass cryptosentinel \
              -dname "CN=CryptoSentinel,OU=Trading,O=Sentinel,C=US"
          fi

      - name: Build APK with Gradle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/CryptoSentinel.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoSentinel-APK
          path: output/CryptoSentinel.apk

      - name: Create Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.7' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Crypto Sentinel Android {0}', github.ref_name) || 'Crypto Sentinel Android v1.1.7' }}
          body: |
            ## ⚡ Crypto Sentinel Android v1.1.7 (24/7 Persistent State & PRO Color-Coded MACD Engine)
            
            ### 🚀 What's New in v1.1.7:
            - 🛡️ **24/7 State Persistence**: Trades, open positions, balance, win/loss stats, and trade stories are now persisted to disk (`StateManager`). Survives Android battery saving, background memory clearance, or closing the app for days. Everything resumes smoothly without resetting!
            - ⚡ **Auto-Start On Phone Reboot**: Added `BootReceiver` (`RECEIVE_BOOT_COMPLETED`, `QUICKBOOT_POWERON`, and `MY_PACKAGE_REPLACED`) so the background monitoring service automatically launches whenever your phone turns on or updates.
            - 🔋 **Battery Optimization Exemption**: Direct 1-tap exemption (`REQUEST_IGNORE_BATTERY_OPTIMIZATIONS`) prevents Android Doze mode from sleeping the WebSocket or background scanners. No external VPS needed—your phone runs completely standalone!
            - 🎯 **Removed Order Flow Radar**: Fully purged obsolete order flow whale alerts and depth wall radars.
            - 🎨 **New PRO Color-Coded MACD(5,13,1) Engine Card**:
              - Dynamic coin title, current price, and 12-hour change %.
              - 1-hour momentum velocity & live signal status.
              - **Triple Color-Coded Badges**: Real-time status for **5M**, **15M**, and **1H** (`🟢 BULLISH`, `🔴 BEARISH`, or `⚪ SCANNING`).
              - **1-Tap 3-TF Chart**: Instant full candlestick and MACD(5,13,1) sub-chart.
              - **1-Tap Direct Execution**: Quick LONG and SHORT buttons for the focal coin.

            ### 🛠️ Stable Signing:
            - 🔑 **Dual Signature Schemes (v1 + v2)**: Permanent signed release with `sentinel.keystore`. Installs seamlessly over previous versions without signature conflicts.

            ### 📥 Download
            Download `CryptoSentinel.apk` below and install directly on your phone.
          files: output/CryptoSentinel.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
