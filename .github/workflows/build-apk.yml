name: Build Crypto Sentinel APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK with Gradle
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/CryptoSentinel.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoSentinel-APK
          path: output/CryptoSentinel.apk

      - name: Create Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.2' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Crypto Sentinel Android {0}', github.ref_name) || 'Crypto Sentinel Android v1.0.2' }}
          body: |
            ## ⚡ Crypto Sentinel Android v1.0.2
            
            ### 🚀 What's New in v1.0.2:
            - 🎯 **3-Tier Adaptive Calculations**:
              - **Tier 1 (Mega Caps - BTC, ETH):** Institutional whale threshold $200k+, TP +1.2%, SL -0.6%.
              - **Tier 2 (Mid Caps - SOL, DOGE, XRP, SUI, NEAR):** Threshold $75k+, TP +2.0%, SL -1.0%.
              - **Tier 3 (Small Alts & Breakout Runners - UAI, AIO, JCT, ELSA, etc.):** Realistic $35k whale burst threshold, TP +4.0%, SL -2.0%!
            - 🛰️ **Dynamic Breakout WebSocket Subscription**: Automatically hooks into the top 3 surging altcoins live so you catch their volume spikes as they happen.
            - 🔥 **Expanded Top Gainers Strip**: Displays top 20 surging crypto alts across Bybit (filtering out US stock ETFs).
            - 💎 **High Precision Price Display**: Formats small altcoins with 4 decimal places ($0.0418) for pinpoint clarity.

            ### 📥 Download
            Download `CryptoSentinel.apk` below and tap to install on your phone.
          files: output/CryptoSentinel.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
