name: Build Crypto Sentinel APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Setup Permanent Signing Keystore
        run: |
          mkdir -p keystore
          if [ ! -f keystore/sentinel.keystore ]; then
            keytool -genkeypair -v \
              -keystore keystore/sentinel.keystore \
              -alias sentinel \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass cryptosentinel \
              -keypass cryptosentinel \
              -dname "CN=CryptoSentinel,OU=Trading,O=Sentinel,C=US"
          fi

      - name: Build APK with Gradle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/CryptoSentinel.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoSentinel-APK
          path: output/CryptoSentinel.apk

      - name: Create Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.4.2' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Crypto Sentinel Android {0}', github.ref_name) || 'Crypto Sentinel Android v1.4.2' }}
          body: |
            ## ⚡ Crypto Sentinel Android v1.4.2 (Bybit API Key Binding & Calibrated $10 Account Engine)
            
            ### 🚀 What's New in v1.4.2:
            - ⚡ **1-Tap $10 Account Preset**: Instantly configure the entire trading and risk architecture for a $10 USDT account with a single tap ($3.50 margin, 3x isolated leverage, +$1.00 TP, -$0.50 SL, auto break-even lock at +2.0%).
            - 🔑 **Bybit V5 Real Trading API Binding**: Securely input and bind your Bybit API Key and Secret directly within the in-app Settings dialog (stored locally in encrypted preferences).
            - 🔍 **Live API Connection & Permissions Tester**: Built-in test button verifies Bybit credentials in real time, checks account connectivity, and confirms that withdrawals are disabled for maximum security.
            - 🔀 **Paper Simulation vs. Live Bybit Switch**: Seamlessly toggle between `🧪 PAPER SIM` and `🔴 LIVE BYBIT` execution. Top bar features a dynamic mode pill so you always know your active status at a glance.
            - 🛡️ **Native Bybit Bracket Orders**: Live orders automatically attach Bybit server-side Take Profit and Stop Loss to protect against mobile disconnections.
            - 🟢 **Pre-Pump & 🔴 Pre-Dump Radar Table**: Full live radar with filter tabs, color-coded OI deltas, and watchlist column headers.
            
            ### 🛠️ Stable Signing:
            - 🔑 **Permanent Dual Signature Scheme (v1 + v2)**: Signed with permanent `sentinel.keystore`. Direct update over previous installations without losing data.
            
            ### 📥 Download
            Download `CryptoSentinel.apk` below and install directly on your phone:
            https://github.com/Abdul9898/crypto-sentinel-android/releases/download/v1.4.2/CryptoSentinel.apk
          files: output/CryptoSentinel.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
