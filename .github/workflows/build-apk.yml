name: Build Crypto Sentinel APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK with Gradle
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/CryptoSentinel.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoSentinel-APK
          path: output/CryptoSentinel.apk

      - name: Create Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.1' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Crypto Sentinel Android {0}', github.ref_name) || 'Crypto Sentinel Android v1.0.1' }}
          body: |
            ## ⚡ Crypto Sentinel Android v1.0.1
            
            ### 🚀 What's New in v1.0.1:
            - 🤖 **Whale Cluster Auto-Trading**: Automatically opens simulated paper trades (Long/Short) when $250k+ whale volume clusters hit the tape, tracking TP (+1.5%) and SL (-0.8%) automatically.
            - 🔥 **Live Bybit Breakout & Top Gainers Scanner**: Scans all Bybit Linear perpetuals in background every 15s to detect and display explosive runners (+10% to +40% gainers like UAI, AIO, etc.).
            - 💼 **Active Positions in Scorecard**: Displays real-time open positions, entry prices, and floating PnL on the main dashboard.
            - 🔔 **Instant Sound & Vibration Alerts**: Alerts on whale cluster executions and breakout spikes.

            ### 📥 Download
            Download `CryptoSentinel.apk` below and tap to install on your phone.
          files: output/CryptoSentinel.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
