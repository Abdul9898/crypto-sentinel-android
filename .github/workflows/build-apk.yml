name: Build Crypto Sentinel APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Setup Permanent Signing Keystore
        run: |
          mkdir -p keystore
          if [ ! -f keystore/sentinel.keystore ]; then
            keytool -genkeypair -v \
              -keystore keystore/sentinel.keystore \
              -alias sentinel \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass cryptosentinel \
              -keypass cryptosentinel \
              -dname "CN=CryptoSentinel,OU=Trading,O=Sentinel,C=US"
          fi

      - name: Build APK with Gradle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/CryptoSentinel.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoSentinel-APK
          path: output/CryptoSentinel.apk

      - name: Create Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.3.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Crypto Sentinel Android {0}', github.ref_name) || 'Crypto Sentinel Android v1.3.0' }}
          body: |
            ## ⚡ Crypto Sentinel Android v1.3.0 (Live Liquidation Flush Hunter & Snapback Sniper)
            
            ### 🚀 What's New in v1.3.0:
            - ⚡ **Real-Time Bybit V5 Liquidation Stream (`allLiquidation.<symbol>`)**: Connected directly to Bybit's high-frequency liquidation order stream over WebSocket. Tracks rolling 45-second institutional and retail liquidations in real time.
            - 🌊 **Long Flush Snapback Sniper**: Detects massive cascade dumping where leveraged retail longs are liquidated ($\ge \$80\text{K}$ on BTC/ETH, $\ge \$25\text{K}$ on mid-caps, $\ge \$15\text{K}$ on altcoin gainers). When forced selling exhausts, the bot snipes **LONG** to capture the sharp V-reversal bounce.
            - 🎯 **Short Squeeze Exhaustion Sniper**: Detects violent squeeze spikes where trapped shorts are forced-liquidated. When artificial buy pressure dries up at the top wick, the bot snipes **SHORT** to ride the instant exhaustion drop.
            - 📊 **Live Liquidation Status in Cockpit Card**: Real-time display on the focal card showing rolling liquidation volume and side (`⚡ LIQ FLUSH: $45,200 Longs` / `⚡ LIQ SQUEEZE: $38,000 Shorts`).
            - 🛡️ **Full Risk Architecture**: Strict 3-minute cooldown per symbol, instant +$2.00 TP, -$3.50 hard SL, sub-cent (< $0.05) token filter, and max 3 simultaneous open positions.
            - 🌊 **Multi-Timeframe Volume Surge Engine (1m, 5m, 15m, 1h)**: Fully preserved and working alongside the Liquidation Flush Hunter!
            
            ### 🛠️ Stable Signing:
            - 🔑 **Permanent Dual Signature Scheme (v1 + v2)**: Signed with permanent `sentinel.keystore`. Direct update over previous installations without uninstalling.
            
            ### 📥 Download
            Download `CryptoSentinel.apk` below and install directly on your phone:
            https://github.com/Abdul9898/crypto-sentinel-android/releases/download/v1.3.0/CryptoSentinel.apk
          files: output/CryptoSentinel.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
