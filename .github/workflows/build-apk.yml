name: Build Crypto Sentinel APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Setup Permanent Signing Keystore
        run: |
          mkdir -p keystore
          if [ ! -f keystore/sentinel.keystore ]; then
            keytool -genkeypair -v \
              -keystore keystore/sentinel.keystore \
              -alias sentinel \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass cryptosentinel \
              -keypass cryptosentinel \
              -dname "CN=CryptoSentinel,OU=Trading,O=Sentinel,C=US"
          fi

      - name: Build APK with Gradle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/CryptoSentinel.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoSentinel-APK
          path: output/CryptoSentinel.apk

      - name: Create Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.9' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Crypto Sentinel Android {0}', github.ref_name) || 'Crypto Sentinel Android v1.1.9' }}
          body: |
            ## ⚡ Crypto Sentinel Android v1.1.9 (Spacious UI & Crypto Metrics Engine)
            
            ### 🚀 What's New in v1.1.9:
            - 📱 **More Space & Full-Screen Scroll**: Wrapped the entire dashboard in a smooth `NestedScrollView` with compact card designs. Active positions, PRO cards, breakout gainers, and signal feeds now fit with ample breathing room without clutter or clipping on any screen size.
            - 🚫 **Closed-Market Stock Token Blacklist**: Excluded traditional US stock/ETF tokens (`UVXY`, `MCD`, `ASTS`, etc.) that freeze outside Wall Street hours. Only authentic 24/7 liquid crypto pairs are scanned and traded.
            - 💧 **24h Turnover Liquidity Gate ($5,000,000+ USD)**: Filtered out dead, illiquid micro-caps (like `ARIA`) with near-zero orderbook depth. Only tokens with millions in active hourly volume are traded.
            - 📊 **Real-Time Crypto Metrics**: Live 24h Turnover (Volume in Billions/Millions), 24h High/Low range, and 1-hour Price Velocity are now dynamically calculated and displayed on the PRO card.
            - ⚡ **Flatline Momentum Gate**: Prevents triggering auto-trades during dead 0.00% velocity range compressions—positions only enter when price momentum is genuinely active.
            
            ### 🛠️ Stable Signing:
            - 🔑 **Dual Signature Schemes (v1 + v2)**: Permanent signed release with `sentinel.keystore`. Installs seamlessly over previous versions without signature conflicts.
            
            ### 📥 Download
            Download `CryptoSentinel.apk` below and install directly on your phone.
          files: output/CryptoSentinel.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
