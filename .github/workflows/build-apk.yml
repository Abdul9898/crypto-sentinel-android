name: Build Crypto Sentinel APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK with Gradle
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/CryptoSentinel.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoSentinel-APK
          path: output/CryptoSentinel.apk

      - name: Create Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.3' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Crypto Sentinel Android {0}', github.ref_name) || 'Crypto Sentinel Android v1.0.3' }}
          body: |
            ## ⚡ Crypto Sentinel Android v1.0.3
            
            ### 🚀 What's New in v1.0.3:
            - 🛡️ **Bulletproof Crash Fix**: Fixed the UI thread format string exception that caused the "Crypto Sentinel has stopped" dialog on trade entries. All UI updates now guarded by error boundaries.
            - 📈 **Interactive Candlestick Chart View**: Tap on any active position to view live 1-minute Bybit candles with visual **Entry Price**, **Take-Profit (TP)**, and **Stop-Loss (SL)** lines!
            - 🛑 **Manual "Close Position Now" Action**: One-tap manual exit button right on the chart dialog so you can exit any position anytime.
            - 📖 **Trade Story & Recent Exits Log**: Displays the complete history of closed trades (Entry, Exit, Win/Loss, PnL in $, and holding time) with tap-to-view historical chart.
            - 🎯 **3-Tier Adaptive Calculations**: Tier 1 (Mega caps), Tier 2 (Mid caps), and Tier 3 (Small alts with $35k whale burst thresholds).

            ### 📥 Download
            Download `CryptoSentinel.apk` below and tap to install on your phone.
          files: output/CryptoSentinel.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
