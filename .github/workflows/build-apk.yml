name: Build Crypto Sentinel APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Setup Permanent Signing Keystore
        run: |
          mkdir -p keystore
          if [ ! -f keystore/sentinel.keystore ]; then
            keytool -genkeypair -v \
              -keystore keystore/sentinel.keystore \
              -alias sentinel \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass cryptosentinel \
              -keypass cryptosentinel \
              -dname "CN=CryptoSentinel,OU=Trading,O=Sentinel,C=US"
          fi

      - name: Build APK with Gradle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/CryptoSentinel.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoSentinel-APK
          path: output/CryptoSentinel.apk

      - name: Create Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.6' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Crypto Sentinel Android {0}', github.ref_name) || 'Crypto Sentinel Android v1.1.6' }}
          body: |
            ## ⚡ Crypto Sentinel Android v1.1.6 (Triple-Timeframe MACD(5,13,1) Engine & Multi-Monitor)
            
            ### 🚀 What's New in v1.1.6:
            - 🎯 **Triple-Timeframe MACD(5, 13, 1) Engine**: Completely stopped all unconfirmed flow signals and trading. Auto-trades and alerts are now driven purely by confirmed **`MACD(5, 13, 1)`** signals monitored concurrently across **`5m`**, **`15m`**, and **`1h`** charts!
            - ⚡ **Direct Zero-Cross Trade Execution**:
              - **LONG**: DIF crosses above 0 (Fast EMA 5 overtakes Slow EMA 13)
              - **SHORT**: DIF crosses below 0 (Fast EMA 5 breaks below Slow EMA 13)
              - Places direct paper trades immediately and sends high-priority notifications stating which timeframe fired!
            - 📊 **3-Timeframe Live Monitor Bar**: The in-app Candlestick dialog displays a real-time 3-timeframe status bar (`5m: 🟢 BULL`, `15m: 🟢 BULL`, `1h: 🔴 BEAR`), letting you monitor all 3 timeframes side-by-side with 1-tap switching.
            - 📈 **Bybit-Style MACD(5, 13, 1) Sub-Chart**: Features a Cyan DIF curve, centered dashed zero baseline, and colored histogram bars showing momentum expansion.
            - 👆 **1-Tap Interactive Charts**: Tapping any coin or gainer in the app immediately opens its 3-timeframe MACD chart.

            ### 🛠️ Stable Signing:
            - 🔑 **Dual Signature Schemes (v1 JAR + v2 APK Block)**: Permanent dual-signed release with `sentinel.keystore`. Installs seamlessly over previous versions with 1 tap.

            ### 📥 Download
            Download `CryptoSentinel.apk` below and tap to update on your phone.
          files: output/CryptoSentinel.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
