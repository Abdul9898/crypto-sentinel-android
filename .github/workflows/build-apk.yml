name: Build Crypto Sentinel APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK with Gradle
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/CryptoSentinel.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoSentinel-APK
          path: output/CryptoSentinel.apk

      - name: Create Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.1' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Crypto Sentinel Android {0}', github.ref_name) || 'Crypto Sentinel Android v1.1.1' }}
          body: |
            ## ⚡ Crypto Sentinel Android v1.1.1
            
            ### 🚀 What's New in v1.1.1:
            - 🎯 **Radar-Driven Auto-Trading**:
              - Automatically enters trades on the leading coin selected by the Radar!
              - **BULLISH RADAR**: When Bids reach ≥ 60% with a heavy Buy Wall ➔ **Auto-Enter LONG** (as seen on UVXY before its +35% rally!).
              - **BEARISH RADAR**: When Asks reach ≥ 60% with a heavy Sell Wall ➔ **Auto-Enter SHORT** (as seen on BTC 80% Asks $675K dump!).
            - ⚡ **1-Tap Instant Radar Actions**:
              - Directly inside the Whale Depth Wall Radar card, tap **`[🟢 LONG COIN]`** or **`[🔴 SHORT COIN]`** for immediate market execution without waiting.
            - 🛡️ **Critical UI & Splash Screen Freeze Fix**:
              - Solved the app hang during violent market dumps.
              - Incoming exchange ticks are buffered and UI rendering is throttled to a smooth 2.5 FPS (400ms buffer).
              - Alerts are rate-limited to 1 notification per 3s to prevent system audio/notification bottlenecks.

            ### 📥 Download
            Download `CryptoSentinel.apk` below and tap to install on your phone.
          files: output/CryptoSentinel.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
