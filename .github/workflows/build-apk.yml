name: Build Crypto Sentinel APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Setup Permanent Signing Keystore
        run: |
          mkdir -p keystore
          if [ ! -f keystore/sentinel.keystore ]; then
            keytool -genkeypair -v \
              -keystore keystore/sentinel.keystore \
              -alias sentinel \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass cryptosentinel \
              -keypass cryptosentinel \
              -dname "CN=CryptoSentinel,OU=Trading,O=Sentinel,C=US"
          fi

      - name: Build APK with Gradle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/CryptoSentinel.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoSentinel-APK
          path: output/CryptoSentinel.apk

      - name: Create Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.4.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Crypto Sentinel Android {0}', github.ref_name) || 'Crypto Sentinel Android v1.4.0' }}
          body: |
            ## ⚡ Crypto Sentinel Android v1.4.0 (Small-Cap Open Interest Velocity & Pre-Pump Radar)
            
            ### 🚀 What's New in v1.4.0:
            - 👑 **Small-Cap Open Interest (OI) % Velocity Engine**: Built specifically for small coins, low-cap altcoins, and new movers. Tracks *relative percentage expansion* of Open Interest across Bybit linear perpetuals. Even a modest \$100K accumulation on a small coin triggers the radar!
            - 🕵️‍♂️ **Stealth Accumulation Sniper (LONG)**: Detects when whales and market makers stealthily load long positions using passive limit orders (OI surges $\ge +15\%$ in $<5$ mins) while price remains calm ($-1.5\%$ to $+2.5\%$). Snipes **LONG** *before* the explosive breakout candle erupts.
            - 🪤 **Short Squeeze Exhaustion Sniper (SHORT)**: Identifies fake trap pumps where price jumps $\ge +4\%$ but Open Interest plummets $\le -10\%$ (liquidating trapped shorts with zero fresh buyers). Snipes **SHORT** at the top wick peak.
            - 📉 **Stealth Short Trap Sniper (SHORT)**: Detects hidden institutional short accumulation (OI surges $\ge +15\%$ with negative CVD) before the breakdown candle.
            - 📊 **Live Real-Time OI Cockpit Display**: The focal cockpit card now displays real-time rolling OI value and velocity (e.g. `🔥 OI SURGE: $420K (+24.5%)`).
            - ⚡ **Triple-Engine Synergy**: The 4-Timeframe Volume Surge Engine, the Live Liquidation Flush Hunter, and the OI Velocity Radar all run concurrently!
            - 🛡️ **Risk Architecture**: Strict 5-minute symbol cooldown, instant +$2.00 TP, -$3.50 hard SL, +1.5% auto break-even lock, and sub-cent (< $0.05) protection.
            
            ### 🛠️ Stable Signing:
            - 🔑 **Permanent Dual Signature Scheme (v1 + v2)**: Signed with permanent `sentinel.keystore`. Direct update over previous installations without losing data.
            
            ### 📥 Download
            Download `CryptoSentinel.apk` below and install directly on your phone:
            https://github.com/Abdul9898/crypto-sentinel-android/releases/download/v1.4.0/CryptoSentinel.apk
          files: output/CryptoSentinel.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
