name: Build Crypto Sentinel APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Setup Permanent Signing Keystore
        run: |
          mkdir -p keystore
          if [ ! -f keystore/sentinel.keystore ]; then
            keytool -genkeypair -v \
              -keystore keystore/sentinel.keystore \
              -alias sentinel \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass cryptosentinel \
              -keypass cryptosentinel \
              -dname "CN=CryptoSentinel,OU=Trading,O=Sentinel,C=US"
          fi

      - name: Build APK with Gradle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/CryptoSentinel.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoSentinel-APK
          path: output/CryptoSentinel.apk

      - name: Create Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.4.1' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Crypto Sentinel Android {0}', github.ref_name) || 'Crypto Sentinel Android v1.4.1' }}
          body: |
            ## ⚡ Crypto Sentinel Android v1.4.1 (Visual Pre-Pump & Pre-Dump Whale Radar + Color-Coded Watchlist)
            
            ### 🚀 What's New in v1.4.1:
            - 🟢 **Pre-Pump & 🔴 Pre-Dump Filter Tabs**: Instant toggle buttons `[ 🟢 PRE-PUMP ACCUMULATION ]` and `[ 🔴 PRE-DUMP EXHAUSTION ]` to quickly isolate coins where whales are quietly loading vs coins suffering squeeze collapse.
            - 🏷️ **Visual Radar Cards**: Each card displays a dynamic badge (`🟢 PRE-PUMP` / `🔴 PRE-DUMP`), prominent color-coded Open Interest changes (`🔥 +24.8% OI` in neon green / `⚠️ -15.2% OI` in red), and exact OI USD volume + 1h velocity.
            - 📊 **Watchlist Column Headers**: Explicit headers for `COIN`, `PRICE`, `CVD (5M)`, `BUY%`, and `OI DELTA` so every column is clear.
            - 🎨 **Live Color-Coded OI Delta Column**: Every tracked coin now shows its live rolling OI Delta % in bright neon green (`#00E676`) for $\ge +5\%$, neon red (`#FF3D71`) for $\le -5\%$, and neutral gray for calm coins.
            - 🎯 **Dedicated High-Visibility Whale Radar Cockpit Banner**: The cockpit card now features an unmissable whale radar banner (`tvProWhaleRadar`) with dynamic color badges for institutional loading or squeeze collapse.
            - 👑 **Small-Cap Open Interest (OI) % Velocity Engine**: Built specifically for low-cap coins and early breakout movers across Bybit linear perpetuals.
            - 🛡️ **Risk & Execution Safety**: Strict 5-minute symbol cooldown, instant +$2.00 TP, -$3.50 hard SL, and +1.5% auto break-even lock.
            
            ### 🛠️ Stable Signing:
            - 🔑 **Permanent Dual Signature Scheme (v1 + v2)**: Signed with permanent `sentinel.keystore`. Direct update over previous installations without losing data.
            
            ### 📥 Download
            Download `CryptoSentinel.apk` below and install directly on your phone:
            https://github.com/Abdul9898/crypto-sentinel-android/releases/download/v1.4.1/CryptoSentinel.apk
          files: output/CryptoSentinel.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
