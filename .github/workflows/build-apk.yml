name: Build Crypto Sentinel APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK with Gradle
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/CryptoSentinel.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoSentinel-APK
          path: output/CryptoSentinel.apk

      - name: Create Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Crypto Sentinel Android {0}', github.ref_name) || 'Crypto Sentinel Android v1.1.0' }}
          body: |
            ## ⚡ Crypto Sentinel Android v1.1.0 (Major Feature Release)
            
            ### 🚀 What's New in v1.1.0:
            - 🛡️ **Trailing Stop-Loss & Auto Break-Even**:
              - Automatically moves Stop-Loss to Entry (+0.06% buffer) once in +1.5% profit so winning trades never turn into losses.
              - Dynamically trails 1.2% behind the peak price once profit exceeds +2.0%, riding massive pumps and locking in gains!
            - 📈 **Multi-Timeframe Candlestick Chart (1m, 5m, 15m)**:
              - Switch between 1-minute, 5-minute, and 15-minute Bybit linear candles with one tap.
              - Visual Entry (Cyan), Take-Profit (Green), and dynamic Trailing Stop-Loss (Red) lines.
            - 📊 **CVD Order-Flow Volume Sub-Chart**:
              - Running Cumulative Volume Delta (CVD) gold line and buy/sell volume bars plotted under the candles to visualize buyer vs seller delta aggression.
            - ⚙️ **Trading Risk & Leverage Settings Panel**:
              - Tap "⚙️ Risk" in header to customize Starting Capital, Position Size ($), Leverage (1x, 3x, 5x, 10x, 20x), and Break-Even/Trailing toggles.
              - Reset Paper Account button.
            - 🎯 **Live Whale Depth Wall Radar**:
              - Real-time Bybit L2 order book scanner (top 50 levels).
              - Visual dual-color Bid vs Ask volume ratio gauge.
              - Highlights nearest major $50k-$200k+ Buy and Sell walls with exact price and depth value.

            ### 📥 Download
            Download `CryptoSentinel.apk` below and tap to install on your phone.
          files: output/CryptoSentinel.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
