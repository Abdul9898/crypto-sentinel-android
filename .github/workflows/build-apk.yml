name: Build Crypto Sentinel APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Setup Permanent Signing Keystore
        run: |
          mkdir -p keystore
          if [ ! -f keystore/sentinel.keystore ]; then
            keytool -genkeypair -v \
              -keystore keystore/sentinel.keystore \
              -alias sentinel \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass cryptosentinel \
              -keypass cryptosentinel \
              -dname "CN=CryptoSentinel,OU=Trading,O=Sentinel,C=US"
          fi

      - name: Build APK with Gradle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/CryptoSentinel.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoSentinel-APK
          path: output/CryptoSentinel.apk

      - name: Create Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.2' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Crypto Sentinel Android {0}', github.ref_name) || 'Crypto Sentinel Android v1.1.2' }}
          body: |
            ## ⚡ Crypto Sentinel Android v1.1.2 (Signed Universal Release)
            
            ### 🛠️ Critical Installer Fix:
            - 🔑 **Dual Signature Schemes (v1 JAR + v2 APK Block)**: Solves "App not installed as package appears to be invalid" on Xiaomi MIUI / HyperOS and modern Android devices.
            - 📦 **Clean Production Package ID**: Stripped `.debug` suffix so the app installs seamlessly as pure `com.cryptosentinel.app`.
            - 🔒 **Fixed Signing Keystore**: Signed with a consistent release key so future updates install smoothly with 1 tap.

            ### 🚀 Features Included:
            - 🎯 **Radar-Driven Auto-Trading**: Auto-enters Long on Bids ≥ 60% + Buy Wall, and Short on Asks ≥ 60% + Sell Wall.
            - ⚡ **1-Tap Instant Radar Actions**: `[🟢 LONG COIN]` and `[🔴 SHORT COIN]` buttons right on the Radar card.
            - 🛡️ **Smooth UI Throttling**: Eliminates main thread lag during heavy market dumps.
            - 📈 **Multi-Timeframe Candles (1m, 5m, 15m) + CVD Sub-Chart**.
            - ⚙️ **Trading Risk & Leverage Settings Panel (1x–20x)**.

            ### 📥 Download
            Download `CryptoSentinel.apk` below and tap to install on your phone.
          files: output/CryptoSentinel.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
