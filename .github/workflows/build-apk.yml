name: Build Crypto Sentinel APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Setup Permanent Signing Keystore
        run: |
          mkdir -p keystore
          if [ ! -f keystore/sentinel.keystore ]; then
            keytool -genkeypair -v \
              -keystore keystore/sentinel.keystore \
              -alias sentinel \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass cryptosentinel \
              -keypass cryptosentinel \
              -dname "CN=CryptoSentinel,OU=Trading,O=Sentinel,C=US"
          fi

      - name: Build APK with Gradle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/CryptoSentinel.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoSentinel-APK
          path: output/CryptoSentinel.apk

      - name: Create Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Crypto Sentinel Android {0}', github.ref_name) || 'Crypto Sentinel Android v1.2.0' }}
          body: |
            ## ⚡ Crypto Sentinel Android v1.2.0 (Dual Stop-Loss Protection & Quant Alpha Cockpit)
            
            ### 🚀 What's New in v1.2.0:
            - 🛑 **Dual-Engine Stop Loss Protection (Option 3)**:
              - **Max Dollar Loss Cap**: Losses are hard-capped at a tight USD amount (default `$3.50`, fully configurable in Settings). A single trade can **never lose $40+ again**!
              - **Auto Reversal Momentum Cut**: If a trade is in negative territory and the short-term trend flips against the position, the app cuts the trade immediately at market price before the loss expands.
            - ⚡ **QUANT ALPHA PRO Cockpit (Replacing Old Radar)**:
              - Completely replaced old radars with the brand new **Quant Alpha Momentum Cockpit**.
              - Real-time institutional multi-timeframe trend alignment (5M, 15M, 1H), 1h price velocity, 24h turnover volume, and 1-tap execution.
            - 🔒 **Proprietary Signal Stealth**:
              - Completely removed all internal indicator names, formulas, and parameters (MACD, DIF, settings) from UI cards, notifications, alerts, and charts.
              - Live charts now feature clean **Momentum Oscillator** and **Alpha Breakout** visualizations.
            - 📱 **Spacious Dashboard & Crypto Metrics**:
              - Full nested scroll layout with dedicated individual position cards and liquid crypto volume filters.
            
            ### 🛠️ Stable Signing:
            - 🔑 **Dual Signature Schemes (v1 + v2)**: Permanent signed release with `sentinel.keystore`. Installs seamlessly over previous versions.
            
            ### 📥 Download
            Download `CryptoSentinel.apk` below and install directly on your phone:
            `https://github.com/Abdul9898/crypto-sentinel-android/releases/download/v1.2.0/CryptoSentinel.apk`
          files: output/CryptoSentinel.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
