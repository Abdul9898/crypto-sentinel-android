name: Build Crypto Sentinel APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Setup Permanent Signing Keystore
        run: |
          mkdir -p keystore
          if [ ! -f keystore/sentinel.keystore ]; then
            keytool -genkeypair -v \
              -keystore keystore/sentinel.keystore \
              -alias sentinel \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass cryptosentinel \
              -keypass cryptosentinel \
              -dname "CN=CryptoSentinel,OU=Trading,O=Sentinel,C=US"
          fi

      - name: Build APK with Gradle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/CryptoSentinel.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoSentinel-APK
          path: output/CryptoSentinel.apk

      - name: Create Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.3' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Crypto Sentinel Android {0}', github.ref_name) || 'Crypto Sentinel Android v1.1.3' }}
          body: |
            ## ⚡ Crypto Sentinel Android v1.1.3 (Individual Position Cards & Quick Exit)
            
            ### 🎴 What's New in v1.1.3:
            - 🃏 **Individual Active Position Cards**: Every open trade (BTC, ETH, Altcoins) now gets its own dedicated card on the dashboard instead of being merged into a single text block.
            - 📈 **Independent Chart for Every Coin**: Tapping "📈 Chart" or tapping any coin's card opens the live 1m/5m/15m Candlestick Chart, CVD Order Flow, and TP/SL levels for that exact coin.
            - ❌ **1-Tap Quick Close Action**: Each position has its own "❌ Close" button on the card with confirmation to exit that specific coin at market price.
            - 🎯 **Multi-Position Depth Radar**: The Whale Depth Wall Radar now monitors and tracks order book imbalances across all open positions.

            ### 🛠️ Stable Signing:
            - 🔑 **Dual Signature Schemes (v1 JAR + v2 APK Block)**: Installs directly on Xiaomi MIUI / HyperOS and all Android devices without "invalid package" errors.
            - 🔒 Signed with the permanent `sentinel.keystore`.

            ### 📥 Download
            Download `CryptoSentinel.apk` below and tap to install/update on your phone.
          files: output/CryptoSentinel.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
